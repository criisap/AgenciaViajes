        <div class="form col-6 col-s-11">
            <form name="Formulario" method="post" action="mailto:cristinaalvarez712@gmail.com">
                <fieldset class="fieldset">
                    <legend class="legend">Formulario de contacto</legend>
                    <ul>
                        <br>
                        <li><label>Nombre</label><input type="text" required></li>
                        <li><label>Apellidos</label><input type="text"></li>
                        <li><label>Móvil</label><input type="tel" minlength="9"></li>
                        <li><label>Email</label><input type="email" required></li>
                        <li><label>Destino</label><select name="destino">
                                <option value="1"></option>
                                <option value="2">Italia</option>
                                <option value="3">Portugal</option>
                                <option value="4">Grecia</option>
                                <option value="5">Malta</option>
                                <option value="6">Turquía</option>
                                <option value="7">Albania</option>
                            </select></li>
                        <li><label>Paquete</label><select name="paquete2">
                                <option value="1"></option>
                                <option value="2">Paquete 1</option>
                                <option value="3">Paquete 2</option>
                                <option value="4">Paquete 3</option>
                                <option value="5">Paquete 4</option>
                            </select></li>
                        <li><label>Mensaje</label><textarea name="Comentarios" id="" cols="30" rows="10"
                                placeholder="Máximo 600 caracteres." minlength="5" maxlength="600"></textarea></li>
                        <li><label>Limpiar</label><input type="reset"></li>
                        <li><label>Enviar</label><input type="image" src="img/pata.png"></li>
                    </ul>
                </fieldset>
            </form>
        </div>
